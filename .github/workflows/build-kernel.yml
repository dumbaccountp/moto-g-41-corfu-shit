name: Build corfu kernel (SukiSU-Ultra + SUSFS)

on:
  push:
    branches: ['arena/a9b14fe3-moto-g-41-corfu-shit', 'MMI-S3SG32.39-191R2']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Base defconfig (arch/arm64/configs)'
        required: true
        default: 'k69v1_64_k419_defconfig'
      ext_config:
        description: 'Product ext config (arch/arm64/configs/ext_config)'
        required: true
        default: 'moto-k69v1_64-corfu.config'
      make_targets:
        description: 'Make targets'
        required: true
        default: 'Image'

env:
  ARCH: arm64
  # gcc 12+ defaults to -fno-common; this 4.19 MTK tree still relies on the
  # old tentative-definition behaviour, so turn it back on globally.
  KCFLAGS: '-fcommon'

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # CONFIG_LOCALVERSION_AUTO needs the tag/branch names to compute the
          # +g<sha> suffix; a shallow clone makes that step fail.
          fetch-depth: 0
          fetch-tags: true

      # The runner image already ships most of the kernel build deps; the
      # aarch64 cross gcc is the one thing it reliably lacks. Install only
      # what is missing, with retries and a hard timeout so a flaky mirror
      # cannot stall the job for half an hour.
      - name: Install host build dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          need=()
          if ! command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            need+=(gcc-aarch64-linux-gnu)
          fi
          for p in bc bison flex libssl-dev libelf-dev cpio kmod rsync device-tree-compiler; do
            dpkg -s "$p" >/dev/null 2>&1 || need+=("$p")
          done
          if [ ${#need[@]} -eq 0 ]; then
            echo "All build dependencies already present."
            exit 0
          fi
          echo "Installing: ${need[*]}"
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::ForceIPv4=true
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 -o Acquire::ForceIPv4=true "${need[@]}"

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          make --version | head -1
          bison --version | head -1
          flex --version

      # AOSP's defconfig.mk concatenates the base defconfig with the product
      # ext_config (and the shared moto-mt6768.config) into $(KERNEL_OUT) and
      # then runs `make defoldconfig`. Reproduce that without the AOSP tree.
      - name: Assemble defconfig
        run: |
          set -euo pipefail
          BASE_DEFCONFIG="${{ github.event.inputs.defconfig || 'k69v1_64_k419_defconfig' }}"
          EXT_CONFIG="${{ github.event.inputs.ext_config || 'moto-k69v1_64-corfu.config' }}"
          SHARED_CONFIG=moto-mt6768.config
          echo "Base defconfig : arch/arm64/configs/$BASE_DEFCONFIG"
          echo "Ext config     : arch/arm64/configs/ext_config/$EXT_CONFIG"
          mkdir -p out
          {
            echo "# Generated by .github/workflows/build-kernel.yml from:"
            echo "#   arch/arm64/configs/${BASE_DEFCONFIG}"
            echo "#   arch/arm64/configs/ext_config/${SHARED_CONFIG}"
            echo "#   arch/arm64/configs/ext_config/${EXT_CONFIG}"
            echo
            cat "arch/arm64/configs/${BASE_DEFCONFIG}"
            cat "arch/arm64/configs/ext_config/${SHARED_CONFIG}"
            cat "arch/arm64/configs/ext_config/${EXT_CONFIG}"
          } > out/.config
          cp out/.config out/mapphone_defconfig

      - name: Resolve config
        run: |
          set -euo pipefail
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            O=out defoldconfig

      - name: Verify KernelSU / SUSFS / KPM configuration
        run: |
          set -euo pipefail
          cfg=out/.config
          fail=0
          require() { grep -qx "CONFIG_$1=y" "$cfg" || { echo "::error::CONFIG_$1 is not enabled"; fail=1; }; }
          forbid()  { if grep -qx "CONFIG_$1=y" "$cfg"; then echo "::error::CONFIG_$1 must be disabled"; fail=1; fi; }

          echo "--- KernelSU core ---"
          require KSU
          require KPM
          require KALLSYMS
          require KALLSYMS_ALL
          forbid  KSU_FEATURE_ADBROOT
          forbid  KSU_DEBUG

          echo "--- SUSFS ---"
          require KSU_SUSFS
          require KSU_SUSFS_SUS_PATH
          require KSU_SUSFS_SUS_MOUNT
          require KSU_SUSFS_SUS_KSTAT
          require KSU_SUSFS_SPOOF_UNAME
          require KSU_SUSFS_ENABLE_LOG
          require KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          require KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          require KSU_SUSFS_OPEN_REDIRECT
          require KSU_SUSFS_SUS_MAP
          require THREAD_INFO_IN_TASK

          grep -E '^CONFIG_(KSU|KALLSYMS_ALL)' "$cfg" | sed 's/^/    /'
          exit "$fail"

      - name: Build ${{ github.event.inputs.make_targets || 'Image' }}
        run: |
          set -euo pipefail
          TARGETS="${{ github.event.inputs.make_targets || 'Image' }}"
          echo "make targets: $TARGETS"
          set -o pipefail
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            O=out $TARGETS 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/Image
          if [ -f out/arch/arm64/boot/Image.gz ]; then cp out/arch/arm64/boot/Image.gz artifacts/; fi
          cp out/vmlinux artifacts/vmlinux
          if [ -f out/System.map ]; then cp out/System.map artifacts/; fi
          cp out/.config artifacts/kernel.config
          ls -lh artifacts

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: corfu-Image
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
