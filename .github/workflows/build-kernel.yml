name: Build corfu kernel (SukiSU-Ultra + SUSFS)

permissions:
  contents: write   # to attach the failure log as a commit comment

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['arena/a9b14fe3-moto-g-41-corfu-shit', 'MMI-S3SG32.39-191R2']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

env:
  # Toolchain that is already proven on this exact board (see build.yml):
  # AOSP clang r383902 = the stock corfu compiler, mirrored on GitHub.
  CLANG_REPO: https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078.git
  CLANG_BRANCH: '10.0'

jobs:
  build:
    name: Build Image.gz + dtbs
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maximize runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # apt is unreliable on these runners right now (it has been hanging on
      # the mirrors), so this step is strictly best-effort: it never fails the
      # job. The runner image already ships bison/flex/dtc/openssl/elf, and the
      # kernel proper is compiled with the AOSP clang prebuilt below, so the
      # only genuinely optional piece is the aarch64 binutils used for a few host
      # tools and the 32-bit vDSO.
      - name: Install build dependencies (best effort)
        continue-on-error: true
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -u
          need=()
          for p in bc bison flex libssl-dev libelf-dev cpio kmod rsync \
                   device-tree-compiler gcc-aarch64-linux-gnu \
                   binutils-aarch64-linux-gnu lz4 zstd unzip xz-utils; do
            dpkg -s "$p" >/dev/null 2>&1 || need+=("$p")
          done
          if [ ${#need[@]} -gt 0 ]; then
            echo "Missing packages: ${need[*]}"
            timeout 90 sudo apt-get update -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=15 -o Acquire::ForceIPv4=true || \
              echo "::warning::apt-get update failed or timed out"
            timeout 90 sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
              -o Acquire::ForceIPv4=true "${need[@]}" || \
              echo "::warning::apt-get install failed or timed out"
          else
            echo "All probed packages already present."
          fi
          echo "--- availability after install attempt ---"
          for b in bison flex dtc bc cpio openssl aarch64-linux-gnu-gcc aarch64-linux-gnu-objcopy arm-linux-gnueabi-gcc; do
            printf '%-28s %s\n' "$b" "$(command -v $b || echo MISSING)"
          done
          exit 0

      - name: Fetch AOSP Clang r383902 (stock corfu toolchain)
        run: |
          git clone --depth=1 -b "${CLANG_BRANCH}" "${CLANG_REPO}" "${RUNNER_TEMP}/clang-r383902"
          "${RUNNER_TEMP}/clang-r383902/bin/clang" --version
          "${RUNNER_TEMP}/clang-r383902/bin/ld.lld" --version

      # Same fragment order AOSP's defconfig.mk feeds the corfu target.
      - name: Configure Moto G41 (corfu) defconfig + fragments
        run: |
          set -euo pipefail
          mkdir -p out
          cat \
            arch/arm64/configs/k69v1_64_k419_defconfig \
            arch/arm64/configs/ext_config/moto-k69v1_64.config \
            arch/arm64/configs/ext_config/moto-mt6768.config \
            arch/arm64/configs/ext_config/mt6768_defconfig.config \
            arch/arm64/configs/ext_config/moto-k69v1_64-corfu.config \
            > out/.config

          CLANG_DIR="${RUNNER_TEMP}/clang-r383902"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CLANG_DIR}/lib64:${LD_LIBRARY_PATH:-}"
          export TARGET_PRODUCT=corfu_g
          export TARGET_BUILD_VARIANT=user

          make -j"$(nproc)" O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            HOSTCC=clang HOSTLD=ld.lld HOSTLDFLAGS=-fuse-ld=lld \
            CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION=+ olddefconfig

      - name: Verify KernelSU / KPM / SUSFS configuration
        run: |
          set -euo pipefail
          cfg=out/.config
          fail=0
          require() { grep -qx "CONFIG_$1=y" "$cfg" || { echo "::error::CONFIG_$1 is not enabled"; fail=1; }; }
          forbid()  { if grep -qx "CONFIG_$1=y" "$cfg"; then echo "::error::CONFIG_$1 must be disabled"; fail=1; fi; }

          require KSU
          require KPM
          require KALLSYMS
          require KALLSYMS_ALL
          require THREAD_INFO_IN_TASK   # Kconfig dependency of CONFIG_KSU_SUSFS
          forbid  KSU_FEATURE_ADBROOT   # adbroot deliberately disabled
          forbid  KSU_DEBUG

          for o in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                   KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG \
                   KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                   KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT \
                   KSU_SUSFS_SUS_MAP; do
            require "$o"
          done

          grep -E '^CONFIG_(KSU|KALLSYMS_ALL|KPM)' "$cfg" | sed 's/^/    /'
          exit "$fail"

      - name: Compile kernel (Image.gz + dtbs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          CLANG_DIR="${RUNNER_TEMP}/clang-r383902"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CLANG_DIR}/lib64:${LD_LIBRARY_PATH:-}"
          export TARGET_PRODUCT=corfu_g
          export TARGET_BUILD_VARIANT=user

          if ! make -j"$(nproc)" O=out ARCH=arm64 \
              LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
              HOSTCC=clang HOSTLD=ld.lld HOSTLDFLAGS=-fuse-ld=lld \
              CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION=+ \
              Image.gz dtbs 2>&1 | tee build.log; then
            echo "=== COMPILER / LINKER ERRORS ==="
            grep -E "error:|Error [0-9]|undefined reference|No rule to make" build.log | tail -n 40 || true
            echo "=== LOG TAIL ==="
            tail -n 80 build.log || true
            # Report through channels that do not depend on the Actions log or
            # artifact blobs: check-run annotations, job summary, commit comment.
            grep -E "error:|Error [0-9]|undefined reference|No rule to make" build.log \
              | tail -n 20 | cut -c1-900 \
              | sed 's/^/::error title=build error::/' || true
            {
              echo "## Kernel build failed"
              echo '```'
              grep -E "error:|Error [0-9]|undefined reference|No rule to make" build.log | tail -n 80 || true
              echo "--- tail ---"
              tail -n 60 build.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 .github/scripts/post_build_log.py \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA" build.log \
              "Kernel build failed (${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER})" || true
            exit 1
          fi

      - name: Verify outputs and KernelSU/SUSFS symbols
        run: |
          set -euo pipefail
          CLANG_DIR="${RUNNER_TEMP}/clang-r383902"
          export PATH="${CLANG_DIR}/bin:${PATH}"

          for f in out/arch/arm64/boot/Image.gz out/vmlinux out/System.map; do
            [ -f "$f" ] || { echo "::error title=MissingBuildOutput::$f not found"; exit 1; }
          done

          echo "kernel release: $(cat out/include/config/kernel.release)"
          llvm-nm out/vmlinux > out/vmlinux.syms
          for sym in kernelsu_init susfs_init ksu_handle_sys_reboot; do
            grep -Eq " ${sym}([.].*)?$" out/vmlinux.syms \
              || { echo "::error title=MissingSymbol::${sym} missing from vmlinux"; exit 1; }
            echo "  found ${sym}"
          done
          echo "  adbroot symbols (expected absent): $(grep -c ksu_adb_root out/vmlinux.syms || true)"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz artifacts/
          cp out/vmlinux artifacts/
          cp out/System.map artifacts/
          cp out/.config artifacts/kernel.config
          find out/arch/arm64/boot/dts -name 'mt6768*.dtb' -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: corfu-Image
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
