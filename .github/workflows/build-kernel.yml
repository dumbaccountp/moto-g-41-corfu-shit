name: Build corfu kernel (SukiSU-Ultra + SUSFS)

on:
  push:
    branches: ['arena/a9b14fe3-moto-g-41-corfu-shit', 'MMI-S3SG32.39-191R2']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

env:
  # Toolchain that is already proven on this exact board (see build.yml):
  # AOSP clang r383902 = the stock corfu compiler, mirrored on GitHub.
  CLANG_REPO: https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078.git
  CLANG_BRANCH: '10.0'

jobs:
  build:
    name: Build Image.gz + dtbs
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maximize runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          need=()
          for p in bc bison build-essential ca-certificates cpio curl device-tree-compiler \
                   file flex gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu git kmod \
                   libelf-dev libncurses-dev libssl-dev lz4 openssl perl python3 rsync \
                   unzip xz-utils zip zstd; do
            dpkg -s "$p" >/dev/null 2>&1 || need+=("$p")
          done
          if [ ${#need[@]} -eq 0 ]; then
            echo "All build dependencies already present."
            exit 0
          fi
          echo "Installing: ${need[*]}"
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::ForceIPv4=true
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 -o Acquire::ForceIPv4=true "${need[@]}"

      - name: Fetch AOSP Clang r383902 (stock corfu toolchain)
        run: |
          git clone --depth=1 -b "${CLANG_BRANCH}" "${CLANG_REPO}" "${RUNNER_TEMP}/clang-r383902"
          "${RUNNER_TEMP}/clang-r383902/bin/clang" --version
          "${RUNNER_TEMP}/clang-r383902/bin/ld.lld" --version

      # Same fragment order AOSP's defconfig.mk feeds the corfu target.
      - name: Configure Moto G41 (corfu) defconfig + fragments
        run: |
          set -euo pipefail
          mkdir -p out
          cat \
            arch/arm64/configs/k69v1_64_k419_defconfig \
            arch/arm64/configs/ext_config/moto-k69v1_64.config \
            arch/arm64/configs/ext_config/moto-mt6768.config \
            arch/arm64/configs/ext_config/mt6768_defconfig.config \
            arch/arm64/configs/ext_config/moto-k69v1_64-corfu.config \
            > out/.config

          CLANG_DIR="${RUNNER_TEMP}/clang-r383902"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CLANG_DIR}/lib64:${LD_LIBRARY_PATH:-}"
          export TARGET_PRODUCT=corfu_g
          export TARGET_BUILD_VARIANT=user

          make -j"$(nproc)" O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            HOSTCC=clang HOSTLD=ld.lld HOSTLDFLAGS=-fuse-ld=lld \
            CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION=+ olddefconfig

      - name: Verify KernelSU / KPM / SUSFS configuration
        run: |
          set -euo pipefail
          cfg=out/.config
          fail=0
          require() { grep -qx "CONFIG_$1=y" "$cfg" || { echo "::error::CONFIG_$1 is not enabled"; fail=1; }; }
          forbid()  { if grep -qx "CONFIG_$1=y" "$cfg"; then echo "::error::CONFIG_$1 must be disabled"; fail=1; fi; }

          require KSU
          require KPM
          require KALLSYMS
          require KALLSYMS_ALL
          require THREAD_INFO_IN_TASK   # Kconfig dependency of CONFIG_KSU_SUSFS
          forbid  KSU_FEATURE_ADBROOT   # adbroot deliberately disabled
          forbid  KSU_DEBUG

          for o in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                   KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG \
                   KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                   KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT \
                   KSU_SUSFS_SUS_MAP; do
            require "$o"
          done

          grep -E '^CONFIG_(KSU|KALLSYMS_ALL|KPM)' "$cfg" | sed 's/^/    /'
          exit "$fail"

      - name: Compile kernel (Image.gz + dtbs)
        run: |
          set -o pipefail
          CLANG_DIR="${RUNNER_TEMP}/clang-r383902"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CLANG_DIR}/lib64:${LD_LIBRARY_PATH:-}"
          export TARGET_PRODUCT=corfu_g
          export TARGET_BUILD_VARIANT=user

          if ! make -j"$(nproc)" O=out ARCH=arm64 \
              LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
              HOSTCC=clang HOSTLD=ld.lld HOSTLDFLAGS=-fuse-ld=lld \
              CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION=+ \
              Image.gz dtbs 2>&1 | tee build.log; then
            echo "=== COMPILER / LINKER ERRORS ==="
            grep -E "error:|undefined|No rule to make|Error " build.log | tail -n 40 || true
            echo "=== LOG TAIL ==="
            tail -n 50 build.log || true
            exit 1
          fi

      - name: Verify outputs and KernelSU/SUSFS symbols
        run: |
          set -euo pipefail
          CLANG_DIR="${RUNNER_TEMP}/clang-r383902"
          export PATH="${CLANG_DIR}/bin:${PATH}"

          for f in out/arch/arm64/boot/Image.gz out/vmlinux out/System.map; do
            [ -f "$f" ] || { echo "::error title=MissingBuildOutput::$f not found"; exit 1; }
          done

          echo "kernel release: $(cat out/include/config/kernel.release)"
          llvm-nm out/vmlinux > out/vmlinux.syms
          for sym in kernelsu_init susfs_init ksu_handle_sys_reboot; do
            grep -Eq " ${sym}([.].*)?$" out/vmlinux.syms \
              || { echo "::error title=MissingSymbol::${sym} missing from vmlinux"; exit 1; }
            echo "  found ${sym}"
          done
          echo "  adbroot symbols (expected absent): $(grep -c ksu_adb_root out/vmlinux.syms || true)"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz artifacts/
          cp out/vmlinux artifacts/
          cp out/System.map artifacts/
          cp out/.config artifacts/kernel.config
          find out/arch/arm64/boot/dts -name 'mt6768*.dtb' -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: corfu-Image
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
