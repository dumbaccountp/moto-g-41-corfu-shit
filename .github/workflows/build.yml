name: Build Moto G41 (corfu) KernelSU-Next + SUSFS + LKMs

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build corfu 4.19.191+ (KSU-Next v3.4.2 + SUSFS v2.3.0 + NoMount v2.2.0 + fgetpriority v0.0.4)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Maximize runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            device-tree-compiler file flex gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi git kmod \
            libelf-dev libncurses-dev libssl-dev lz4 openssl perl \
            python2 python3 python-is-python3 rsync unzip xz-utils zip zstd

      - name: Fetch AOSP Clang r383902 (11.0.1 - stock corfu toolchain)
        run: |
          git clone --depth=1 -b 10.0 \
            https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078.git \
            "${RUNNER_TEMP}/clang-r383902"
          "${RUNNER_TEMP}/clang-r383902/bin/clang" --version
          "${RUNNER_TEMP}/clang-r383902/bin/ld.lld" --version

      - name: Configure Moto G41 (corfu) defconfig + fragments
        run: |
          mkdir -p out
          cat \
            arch/arm64/configs/k69v1_64_k419_defconfig \
            arch/arm64/configs/ext_config/moto-k69v1_64.config \
            arch/arm64/configs/ext_config/moto-mt6768.config \
            arch/arm64/configs/ext_config/mt6768_defconfig.config \
            arch/arm64/configs/ext_config/moto-k69v1_64-corfu.config \
            > out/.config

          CLANG_DIR="${RUNNER_TEMP}/clang-r383902"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CLANG_DIR}/lib64:${LD_LIBRARY_PATH:-}"
          export TARGET_PRODUCT=corfu_g
          export TARGET_BUILD_VARIANT=user
          export LOCALVERSION=+

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            HOSTCC=clang \
            HOSTLD=ld.lld \
            HOSTLDFLAGS=-fuse-ld=lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION=+ \
            olddefconfig

          echo "=== Verifying KSU, SUSFS, KALLSYMS_ALL, NoMount & fgetpriority Kconfig state ==="
          grep -E "^CONFIG_(KSU|KALLSYMS|NOMOUNT|FGETPRIORITY|TMPFS_XATTR|TMPFS_POSIX_ACL|MODVERSIONS)" out/.config
          grep -q "^CONFIG_KSU=y$" out/.config
          grep -q "^CONFIG_KSU_MANUAL_HOOK=y$" out/.config
          grep -q "^CONFIG_KSU_SUSFS=y$" out/.config
          grep -q "^CONFIG_KALLSYMS=y$" out/.config
          grep -q "^CONFIG_KALLSYMS_ALL=y$" out/.config
          grep -q "^CONFIG_NOMOUNT=m$" out/.config
          grep -q "^CONFIG_FGETPRIORITY=m$" out/.config
          grep -q "^CONFIG_TMPFS_XATTR=y$" out/.config
          grep -q "^CONFIG_MODVERSIONS=y$" out/.config

      - name: Compile Kernel (Image.gz), Modules (NoMount + fgetpriority LKMs), and MT6768 DTB
        run: |
          set -o pipefail
          CLANG_DIR="${RUNNER_TEMP}/clang-r383902"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CLANG_DIR}/lib64:${LD_LIBRARY_PATH:-}"
          export TARGET_PRODUCT=corfu_g
          export TARGET_BUILD_VARIANT=user
          export LOCALVERSION=+

          if ! make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            HOSTCC=clang \
            HOSTLD=ld.lld \
            HOSTLDFLAGS=-fuse-ld=lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION=+ \
            Image.gz modules dtbs 2>&1 | tee build.log; then
            echo "=== COMPILER / LINKER ERRORS ==="
            ERR_SUMMARY="$(grep -E "error:|undefined|No rule to make|Error " build.log | tail -n 40 | tr '\n' '|' | cut -c1-3500)"
            echo "::error title=KernelBuildFailed::${ERR_SUMMARY}"
            TAIL_LOG="$(tail -n 50 build.log | tr '\n' '|' | cut -c1-3500)"
            echo "::error title=BuildLogTail::${TAIL_LOG}"
            exit 1
          fi

      - name: Verify vermagic, symbols, NoMount v2.2.0 LKM, fgetpriority v0.0.4 LKM, and build dtb.img
        run: |
          CLANG_DIR="${RUNNER_TEMP}/clang-r383902"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CLANG_DIR}/lib64:${LD_LIBRARY_PATH:-}"

          RELEASE="$(cat out/include/config/kernel.release)"
          echo "Kernel release (vermagic): ${RELEASE}"
          if [ "${RELEASE}" != "4.19.191+" ]; then
            echo "::error title=VermagicMismatch::Expected 4.19.191+, got '${RELEASE}'"
            exit 1
          fi

          for required_out in \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/dts/mediatek/mt6768.dtb \
            out/fs/nomount/nomount.ko \
            out/drivers/fgetpriority/fgetpriority.ko; do
            if [ ! -f "${required_out}" ]; then
              echo "::error title=MissingBuildOutput::${required_out} not found"
              exit 1
            fi
          done

          echo "=== Verifying linked KernelSU-Next & SUSFS symbols in vmlinux ==="
          llvm-nm -S out/vmlinux > out/vmlinux.syms
          for sym in kernelsu_init susfs_init ksu_handle_sys_reboot is_ksu_transition ksu_adb_root_handle_execve_manual; do
            if ! grep -Eq " ${sym}([.$].*)?$" out/vmlinux.syms; then
              echo "::error title=MissingSymbol::Symbol ${sym} not found in vmlinux"
              exit 1
            fi
          done

          echo "=== Verifying fgetpriority target symbols & BL find_user callsites in vmlinux ==="
          python3 - << 'PY'
          import struct, subprocess, sys

          syms = {}
          with open("out/vmlinux.syms") as f:
              for line in f:
                  parts = line.strip().split()
                  if len(parts) == 4:
                      addr, size, stype, name = int(parts[0], 16), int(parts[1], 16), parts[2], parts[3]
                  elif len(parts) == 3 and parts[0][0] in "0123456789abcdefABCDEF":
                      addr, size, stype, name = int(parts[0], 16), 1024, parts[1], parts[2]
                  else:
                      continue
                  base = name.split(".")[0]
                  if name == base or base not in syms:
                      syms[base] = (addr, size, stype)

          for req in ["find_user", "free_uid", "aarch64_insn_gen_branch_imm", "aarch64_insn_patch_text", "__vmalloc_node_range"]:
              if req not in syms:
                  print(f"::error title=MissingFgpTarget::{req} missing from vmlinux")
                  sys.exit(1)
              print(f"  {req}: 0x{syms[req][0]:x} (size={syms[req][1]})")

          # Map .text virtual address to file offset in out/vmlinux
          sec_out = subprocess.check_output(["aarch64-linux-gnu-readelf", "-S", "-W", "out/vmlinux"], text=True)
          text_vma = text_off = text_sz = None
          for line in sec_out.splitlines():
              cols = line.strip().split()
              if ".text" in cols:
                  idx = cols.index(".text")
                  if cols[idx] == ".text" and idx + 4 < len(cols):
                      text_vma = int(cols[idx + 2], 16)
                      text_off = int(cols[idx + 3], 16)
                      text_sz  = int(cols[idx + 4], 16)
                      break
          assert text_vma is not None, "Could not locate .text in vmlinux"

          find_user_addr = syms["find_user"][0]
          with open("out/vmlinux", "rb") as vf:
              for arm_s, se_s in [
                  ("__arm64_sys_getpriority", "__se_sys_getpriority"),
                  ("__arm64_sys_setpriority", "__se_sys_setpriority"),
                  ("__arm64_sys_ioprio_set",  "__se_sys_ioprio_set"),
                  ("__arm64_sys_ioprio_get",  "__se_sys_ioprio_get"),
              ]:
                  matched = None
                  for cand in (arm_s, se_s):
                      if cand not in syms:
                          continue
                      c_addr, c_sz, _ = syms[cand]
                      scan_len = c_sz if c_sz > 0 else 1024
                      vf.seek(text_off + (c_addr - text_vma))
                      blob = vf.read(scan_len)
                      for off in range(0, len(blob) - 3, 4):
                          insn = struct.unpack_from("<I", blob, off)[0]
                          if (insn & 0x7C000000) == 0x14000000:
                              imm26 = insn & 0x03FFFFFF
                              if imm26 & 0x02000000:
                                  imm26 -= 0x04000000
                              dest = (c_addr + off) + imm26 * 4
                              if dest == find_user_addr:
                                  matched = (cand, c_addr + off, insn)
                                  break
                      if matched:
                          break
                  if not matched:
                      print(f"::error title=MissingFindUserBranch::No B/BL find_user found in {arm_s} or {se_s}")
                      sys.exit(1)
                  print(f"  Verified callsite in {matched[0]} @ 0x{matched[1]:x} (insn=0x{matched[2]:08x} -> find_user 0x{find_user_addr:x})")
          PY

          mkdir -p dist
          strip_ko() {
            if [ -x "${CLANG_DIR}/bin/llvm-strip" ]; then
              "${CLANG_DIR}/bin/llvm-strip" --strip-debug "$1"
            else
              aarch64-linux-gnu-strip --strip-debug "$1"
            fi
            if grep -q "^CONFIG_MODULE_SIG=y$" out/.config && [ -x out/scripts/sign-file ]; then
              SIG_HASH="$(sed -n 's/^CONFIG_MODULE_SIG_HASH="\(.*\)"$/\1/p' out/.config)"
              SIG_KEY="$(sed -n 's/^CONFIG_MODULE_SIG_KEY="\(.*\)"$/\1/p' out/.config)"
              out/scripts/sign-file "${SIG_HASH}" "out/${SIG_KEY}" out/certs/signing_key.x509 "$1"
            fi
          }

          echo "=== Preparing & verifying NoMount v2.2.0 LKM (nomount-4.19.ko) ==="
          cp out/fs/nomount/nomount.ko dist/nomount-4.19.ko
          strip_ko dist/nomount-4.19.ko
          cp dist/nomount-4.19.ko dist/nomount.ko
          file dist/nomount-4.19.ko
          /sbin/modinfo dist/nomount-4.19.ko | tee dist/nomount-modinfo.txt
          echo "--- MODVERSIONS CRCs ---" >> dist/nomount-modinfo.txt
          /sbin/modprobe --dump-modversions dist/nomount-4.19.ko >> dist/nomount-modinfo.txt 2>&1 || true

          NM_VERMAGIC="$(/sbin/modinfo -F vermagic dist/nomount-4.19.ko)"
          NM_VERSION="$(/sbin/modinfo -F version dist/nomount-4.19.ko)"
          case "${NM_VERMAGIC}" in
            "4.19.191+ "*modversions*aarch64*) ;;
            *) echo "::error title=NoMountVermagicMismatch::Unexpected vermagic '${NM_VERMAGIC}'"; exit 1 ;;
          esac
          if [ "${NM_VERSION}" != "22 (605)" ]; then
            echo "::error title=NoMountVersionMismatch::Expected version '22 (605)', got '${NM_VERSION}'"
            exit 1
          fi

          echo "=== Preparing & verifying fgetpriority v0.0.4 LKM (corfu-4.19_arm64_fgetpriority.ko) ==="
          cp out/drivers/fgetpriority/fgetpriority.ko dist/corfu-4.19_arm64_fgetpriority.ko
          strip_ko dist/corfu-4.19_arm64_fgetpriority.ko
          cp dist/corfu-4.19_arm64_fgetpriority.ko dist/fgetpriority.ko
          file dist/fgetpriority.ko
          /sbin/modinfo dist/fgetpriority.ko | tee dist/fgetpriority-modinfo.txt
          echo "--- MODVERSIONS CRCs ---" >> dist/fgetpriority-modinfo.txt
          /sbin/modprobe --dump-modversions dist/fgetpriority.ko >> dist/fgetpriority-modinfo.txt 2>&1 || true

          FGP_VERMAGIC="$(/sbin/modinfo -F vermagic dist/fgetpriority.ko)"
          FGP_VERSION="$(/sbin/modinfo -F version dist/fgetpriority.ko)"
          case "${FGP_VERMAGIC}" in
            "4.19.191+ "*modversions*aarch64*) ;;
            *) echo "::error title=FgpVermagicMismatch::Unexpected vermagic '${FGP_VERMAGIC}'"; exit 1 ;;
          esac
          if [ "${FGP_VERSION}" != "0.0.4" ]; then
            echo "::error title=FgpVersionMismatch::Expected version '0.0.4', got '${FGP_VERSION}'"
            exit 1
          fi

          echo "=== Wrapping mt6768.dtb into Android dt_table dtb.img ==="
          python3 - << 'PY'
          import struct
          dtb = open("out/arch/arm64/boot/dts/mediatek/mt6768.dtb", "rb").read()
          total_size = 64 + len(dtb)
          hdr = struct.pack(">8I", 0xd7b7ab1e, total_size, 32, 32, 1, 64, 2048, 0)
          ent = struct.pack(">8I", len(dtb), 64, 0, 0, 0, 0, 0, 0)
          with open("out/arch/arm64/boot/dtb.img", "wb") as f:
              f.write(hdr + ent + dtb)
          print(f"Created out/arch/arm64/boot/dtb.img ({total_size} bytes)")
          PY

      - name: Package AnyKernel3, NoMount v2.2.0 Metamodule, & fgetpriority v0.0.4 Module Zips
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "${RUNNER_TEMP}/AnyKernel3"
          rm -rf "${RUNNER_TEMP}/AnyKernel3/.git" "${RUNNER_TEMP}/AnyKernel3/modules" "${RUNNER_TEMP}/AnyKernel3/patch" "${RUNNER_TEMP}/AnyKernel3/ramdisk"

          cat > "${RUNNER_TEMP}/AnyKernel3/anykernel.sh" << 'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Moto G41 (corfu) 4.19.191+ | KernelSU-Next v3.4.2 + SUSFS v2.3.0
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=corfu
          device.name2=corfud
          device.name3=corful
          device.name4=corfu_g
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AK3

          sed -i 's/^          //' "${RUNNER_TEMP}/AnyKernel3/anykernel.sh"
          cp out/arch/arm64/boot/Image.gz "${RUNNER_TEMP}/AnyKernel3/Image.gz"

          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          ZIP_NAME="KernelSU-Next-v3.4.2-SUSFS-v2.3.0-corfu-4.19.191-${SHORT_SHA}.zip"
          (
            cd "${RUNNER_TEMP}/AnyKernel3"
            zip -r9 "${GITHUB_WORKSPACE}/dist/${ZIP_NAME}" . -x "*.git*" "README.md" "*placeholder"
          )

          echo "=== Bundling NoMount v2.2.0 Metamodule with corfu 4.19.191+ LKM ==="
          curl -fL --retry 3 \
            "https://github.com/maxsteeel/nomount/releases/download/v2.2.0/NoMount-v2.2.0-release-605.zip" \
            -o "${RUNNER_TEMP}/NoMount-v2.2.0-release-605.zip"
          mkdir -p "${RUNNER_TEMP}/nomount-metamodule"
          unzip -q "${RUNNER_TEMP}/NoMount-v2.2.0-release-605.zip" -d "${RUNNER_TEMP}/nomount-metamodule"
          mkdir -p "${RUNNER_TEMP}/nomount-metamodule/lkm"
          install -m 0644 dist/nomount-4.19.ko "${RUNNER_TEMP}/nomount-metamodule/lkm/nomount-4.19.ko"

          for req in lkm/nomount-4.19.ko bin/nm-arm64 bin/lkmloader-arm64 customize.sh common.sh module.prop; do
            if [ ! -f "${RUNNER_TEMP}/nomount-metamodule/${req}" ]; then
              echo "::error title=MissingNoMountFile::Missing ${req} in NoMount metamodule bundle"
              exit 1
            fi
          done

          NM_ZIP="NoMount-v2.2.0-release-605-corfu-4.19.191.zip"
          (
            cd "${RUNNER_TEMP}/nomount-metamodule"
            zip -qr9 "${GITHUB_WORKSPACE}/dist/${NM_ZIP}" .
          )

          echo "=== Bundling fgetpriority v0.0.4 Module with corfu 4.19.191+ LKM ==="
          curl -fL --retry 3 \
            "https://github.com/aerath-stuff/fgetpriority/releases/download/v0.0.4/fgetpriority_v0.0.4.zip" \
            -o "${RUNNER_TEMP}/fgetpriority_v0.0.4.zip"
          mkdir -p "${RUNNER_TEMP}/fgetpriority-module"
          unzip -q "${RUNNER_TEMP}/fgetpriority_v0.0.4.zip" -d "${RUNNER_TEMP}/fgetpriority-module"
          mkdir -p "${RUNNER_TEMP}/fgetpriority-module/ko"
          install -m 0644 dist/corfu-4.19_arm64_fgetpriority.ko \
            "${RUNNER_TEMP}/fgetpriority-module/ko/corfu-4.19_arm64_fgetpriority.ko"

          for req in ko/corfu-4.19_arm64_fgetpriority.ko customize.sh service.sh uninstall.sh module.prop; do
            if [ ! -f "${RUNNER_TEMP}/fgetpriority-module/${req}" ]; then
              echo "::error title=MissingFgpFile::Missing ${req} in fgetpriority module bundle"
              exit 1
            fi
          done

          FGP_ZIP="fgetpriority_v0.0.4-corfu-4.19.191.zip"
          (
            cd "${RUNNER_TEMP}/fgetpriority-module"
            zip -qr9 "${GITHUB_WORKSPACE}/dist/${FGP_ZIP}" .
          )

          cp out/arch/arm64/boot/Image.gz dist/Image.gz
          cp out/arch/arm64/boot/dtb.img dist/dtb.img
          cp out/.config dist/corfu_kernel.config
          cp out/Module.symvers dist/Module.symvers

          (
            cd dist
            sha256sum \
              fgetpriority.ko corfu-4.19_arm64_fgetpriority.ko "${FGP_ZIP}" \
              nomount-4.19.ko nomount.ko "${NM_ZIP}" \
              "${ZIP_NAME}" > SHA256SUMS.txt
          )
          cp dist/SHA256SUMS.txt dist/nomount-SHA256SUMS.txt
          cp dist/SHA256SUMS.txt dist/fgetpriority-SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          ls -lh dist/

          AK3_SIZE="$(stat -c '%s' "dist/${ZIP_NAME}")"
          AK3_SHA="$(sha256sum "dist/${ZIP_NAME}" | awk '{print $1}')"
          FGP_KO_SIZE="$(stat -c '%s' dist/fgetpriority.ko)"
          FGP_KO_SHA="$(sha256sum dist/fgetpriority.ko | awk '{print $1}')"
          FGP_ZIP_SIZE="$(stat -c '%s' "dist/${FGP_ZIP}")"
          FGP_ZIP_SHA="$(sha256sum "dist/${FGP_ZIP}" | awk '{print $1}')"
          FGP_VM="$(/sbin/modinfo -F vermagic dist/fgetpriority.ko)"
          FGP_VER="$(/sbin/modinfo -F version dist/fgetpriority.ko)"
          echo "::notice title=BuildVerified::${ZIP_NAME} (${AK3_SIZE} B, sha256=${AK3_SHA}, CONFIG_KALLSYMS_ALL=y) | fgetpriority.ko (${FGP_KO_SIZE} B, sha256=${FGP_KO_SHA}, version='${FGP_VER}', vermagic='${FGP_VM}') | ${FGP_ZIP} (${FGP_ZIP_SIZE} B, sha256=${FGP_ZIP_SHA})"

          {
            echo "## Moto G41 (\`corfu\`) 4.19.191+ Build Summary"
            echo "- **Kernel**: Linux \`4.19.191+\` (\`CONFIG_KALLSYMS_ALL=y\`) | KernelSU-Next \`v3.4.2\` (\`33355\`) + SUSFS \`v2.3.0\`"
            echo "- **AnyKernel3 (\`${ZIP_NAME}\`)**: \`${AK3_SIZE}\` bytes, SHA-256: \`${AK3_SHA}\`"
            echo "- **fgetpriority LKM**: \`v0.0.4\` (\`version=${FGP_VER}\`, \`vermagic=${FGP_VM}\`, \`${FGP_KO_SIZE}\` bytes, SHA-256: \`${FGP_KO_SHA}\`)"
            echo "- **\`${FGP_ZIP}\` SHA-256**: \`${FGP_ZIP_SHA}\`"
            echo "- **NoMount LKM**: \`v2.2.0\` (\`22 (605)\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload fgetpriority v0.0.4 Standalone LKM (corfu 4.19.191+)
        uses: actions/upload-artifact@v4
        with:
          name: fgetpriority-v0.0.4-corfu-4.19.191-LKM
          path: |
            dist/fgetpriority.ko
            dist/corfu-4.19_arm64_fgetpriority.ko
            dist/fgetpriority-modinfo.txt
            dist/fgetpriority-SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload fgetpriority v0.0.4 KernelSU Module Zip (corfu LKM pre-bundled)
        uses: actions/upload-artifact@v4
        with:
          name: fgetpriority-v0.0.4-corfu-Module
          path: dist/fgetpriority_v0.0.4-corfu-4.19.191.zip
          if-no-files-found: error

      - name: Upload NoMount v2.2.0 Standalone LKM (corfu 4.19.191+)
        uses: actions/upload-artifact@v4
        with:
          name: NoMount-v2.2.0-corfu-4.19.191-LKM
          path: |
            dist/nomount-4.19.ko
            dist/nomount.ko
            dist/nomount-modinfo.txt
            dist/nomount-SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload NoMount v2.2.0 Metamodule Zip (corfu LKM pre-bundled)
        uses: actions/upload-artifact@v4
        with:
          name: NoMount-v2.2.0-corfu-Metamodule
          path: dist/NoMount-v2.2.0-release-605-corfu-4.19.191.zip
          if-no-files-found: error

      - name: Upload AnyKernel3 Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-v3.4.2-SUSFS-v2.3.0-corfu-AnyKernel3
          path: dist/KernelSU-Next-*.zip
          if-no-files-found: error

      - name: Upload Raw Kernel Images & Build Metadata
        uses: actions/upload-artifact@v4
        with:
          name: corfu-raw-images-and-symvers
          path: |
            dist/Image.gz
            dist/dtb.img
            dist/corfu_kernel.config
            dist/Module.symvers
            dist/nomount-4.19.ko
            dist/fgetpriority.ko
          if-no-files-found: error
